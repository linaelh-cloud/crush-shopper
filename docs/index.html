<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crush Shopper</title>
<!-- Crush Shopper en ligne : la page vit sur GitHub Pages, la liste dans wishlist.json du dépôt,
     et le robot GitHub lit le stock. Design « bordeaux » créé par Lina (18/11/2026). -->
<link rel="manifest" href="manifest.json?v=3">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Crush Shopper">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fdfaf6">
<link rel="icon" href="icon-192.png?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Jost:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap">
<style>
/* ================= Design de Lina : bordeaux, crème, rose poudré ================= */
:root {
  --bordeaux: #0c0c0c; --bordeaux-2: #0c0c0c; --creme: #fdfaf6; --carte: #fefcf9; --bord: #e7e0d8;  /* noir et crème (maquette du 18/11) */
  --rose: #ece6df; --rose-clair: #f3ede6; --texte: #141414; --gris: #6f6a66;
  --vert: #1a8a12; --rouge: #b10605;
  --font-logo: "Michroma", "Eurostile", "Arial Black", sans-serif;
  --font-caps: "Jost", "Futura", "Century Gothic", sans-serif;
  --font-serif: "Cormorant Garamond", "Didot", Georgia, serif;
  --barre: 156px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
/* Toute la page un peu plus petite (demandé le 18/11 : « c'est un peu grand ») */
html { zoom: 0.6; }   /* mon modèle était une capture Retina (2× plus de pixels) : on revient à la taille réelle */
@media (max-width: 760px) { html { zoom: 0.86; } }
body { background: var(--creme); color: var(--texte); font-family: var(--font-caps); font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--bordeaux); outline-offset: 2px; }
@keyframes monte { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* --- Barre bordeaux à gauche, avec le logo CS✦ et ses reflets --- */
.barre { position: fixed; inset: 0 auto 0 0; width: var(--barre); background: var(--bordeaux); color: #fff; z-index: 6; overflow: hidden; }
.burger { position: absolute; left: 44px; top: 42px; width: 56px; height: 40px; border: 0; background: none; cursor: pointer; display: grid; gap: 9px; align-content: center; padding: 0; }
.burger i { display: block; height: 2px; background: #fff; border-radius: 2px; }
.cs { font-family: var(--font-logo); letter-spacing: -0.04em; line-height: 1; position: absolute; white-space: nowrap; }
.cs sup { font-family: var(--font-caps); font-size: 0.55em; vertical-align: 0.9em; margin-left: 0.04em; }
.cs.grand { left: 22px; top: 186px; font-size: 3.4rem; color: #fff; }
.cs.reflet { color: #fff; opacity: 0.27; font-size: 1.95rem; }

/* --- Contenu --- */
.page { margin-left: var(--barre); padding: 0 22px 90px 26px; }
/* Le contenu est centré dans l'espace à droite de la barre bordeaux */
.contenu { max-width: none; }  /* toute la largeur : nom à gauche, bannière d'un bord à l'autre */
header { display: flex; align-items: center; gap: 20px; padding: 26px 0 22px; }
.titre h1 { white-space: nowrap; margin: 0; font-family: var(--font-logo); font-weight: 400; font-size: 2.6rem; line-height: 1; color: var(--bordeaux); letter-spacing: 0.01em; -webkit-text-stroke: 1.4px var(--bordeaux); }
.titre p { margin: 8px 0 0 50px; font-family: var(--font-caps); font-weight: 500; font-size: 0.98rem; letter-spacing: 0.36em; color: var(--bordeaux); }
.icones { margin-left: auto; display: flex; align-items: center; }
.icones button { position: relative; border: 0; background: none; cursor: pointer; color: var(--texte); padding: 6px 30px; display: grid; place-items: center; }
.icones button + button { border-left: 2px solid var(--texte); }
.icones svg { width: 40px; height: 40px; }
.badge { position: absolute; top: 0; right: 20px; min-width: 20px; height: 20px; border-radius: 999px; background: var(--bordeaux); color: #fff; font-size: 0.72rem; font-weight: 600; display: grid; place-items: center; padding: 0 5px; }

.bande { display: none; }
.banniere { display: block; width: 100%; height: auto; border-radius: 22px; box-shadow: 0 10px 30px -22px rgba(20,20,20,0.6); }

.outils { display: flex; gap: 24px; align-items: center; margin-top: 30px; }
.recherche { flex: 1.4; display: flex; align-items: center; gap: 14px; background: #fefcf9; border: 1.5px solid #ece7e0; border-radius: 999px; padding: 0 22px; height: 66px; }
.recherche svg { flex: none; width: 30px; height: 30px; color: var(--texte); }
.recherche input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-family: var(--font-serif); font-style: italic; font-size: 1.45rem; color: var(--texte); }
.recherche input::placeholder { color: #57504e; }
.categories { flex: 1; position: relative; }
.categories select { width: 100%; height: 66px; appearance: none; -webkit-appearance: none; background: #fefcf9; border: 1.5px solid #ece7e0; border-radius: 999px; padding: 0 56px 0 38px; font-family: var(--font-serif); font-style: italic; font-size: 1.45rem; color: var(--texte); cursor: pointer; }
.categories svg { position: absolute; right: 26px; top: 50%; transform: translateY(-50%); width: 26px; height: 26px; pointer-events: none; }
.vues { display: flex; gap: 22px; }
.vues button { width: 66px; height: 66px; border-radius: 14px; border: 1.5px solid #e4ded7; background: #fefcf9; color: var(--texte); cursor: pointer; display: grid; place-items: center; }
.vues button svg { width: 32px; height: 32px; }
.vues button.on { background: var(--bordeaux); border-color: var(--bordeaux); color: #fff; }

.puces { display: flex; align-items: center; gap: 18px; margin: 28px 0 0; }
.puces .liste { display: flex; gap: 18px; overflow-x: auto; scrollbar-width: none; }
.puces .liste::-webkit-scrollbar { display: none; }
.puce { flex: none; min-width: 190px; height: 54px; padding: 0 26px; border-radius: 999px; border: 1.5px solid #0e0e0e; background: #fff; color: #0e0e0e; font-family: var(--font-caps); font-weight: 500; font-size: 1.15rem; letter-spacing: 0.24em; text-transform: uppercase; cursor: pointer; }  /* même style que CRUSH ALERTE */
.puce.on { background: #0e0e0e; color: #fff; }
.compte { margin-left: auto; flex: none; font-family: var(--font-serif); font-style: italic; font-size: 1.55rem; color: var(--bordeaux); padding-right: 16px; border-right: 2px solid var(--bordeaux); }

/* --- Les cartes --- */
.grille { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 30px; margin-top: 32px; }
@media (max-width: 1100px) and (min-width: 761px) { .grille { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1000px) { .grille { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; } }
@media (min-width: 1200px) { .grille { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 24px; } }
.carte { position: relative; display: flex; flex-direction: column; animation: monte .4s ease both; }
.carte.vue { animation: none; }
/* L'affiche : grande photo verticale, texte blanc posé en bas sur un léger dégradé */
.affiche { position: relative; display: block; aspect-ratio: 3 / 4.4; border-radius: 16px; overflow: hidden; background: #e9e4df; box-shadow: 0 14px 30px -20px rgba(30,20,10,0.55); text-decoration: none; }
.affiche img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.affiche::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to bottom, rgba(0,0,0,0.06) 0%, rgba(0,0,0,0) 32%, rgba(0,0,0,0) 48%, rgba(0,0,0,0.55) 100%); }
.affiche .vide { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-family: var(--font-serif); font-style: italic; font-size: 1.3rem; color: var(--gris); padding: 20px; }
.affiche.sans-photo::after { background: none; }
.etat { position: absolute; left: 22px; top: 22px; z-index: 2; display: inline-flex; align-items: center; gap: 9px; background: rgba(255,255,255,0.95); color: #0e0e0e; border-radius: 999px; padding: 6px 16px 6px 14px; font-family: var(--font-caps); font-size: 1.3rem; font-weight: 500; }
.etat::before { content: ""; width: 11px; height: 11px; border-radius: 50%; background: var(--gris); }
.etat.dispo::before { background: var(--vert); } .etat.rupture::before { background: #a23a2c; }
.etat.attente::before { background: #c9902d; }
.croix { position: absolute; right: 22px; top: 22px; z-index: 2; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255,255,255,0.95); color: #0e0e0e; font-size: 1.5rem; line-height: 1; cursor: pointer; display: grid; place-items: center; }
.infos { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding: 0 26px 28px; color: #fff; display: grid; gap: 4px; text-shadow: 0 1px 12px rgba(0,0,0,0.25); }
.affiche.sans-photo .infos { color: #0e0e0e; text-shadow: none; }
.marque { margin: 0; font-family: var(--font-caps); font-weight: 400; font-size: 1.3rem; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.95; }
.nom { margin: 0; font-family: var(--font-caps); font-weight: 400; font-size: 1.85rem; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.taille { margin: 4px 0 0; font-family: var(--font-caps); font-weight: 300; font-size: 1.4rem; opacity: 0.95; }
.alerter { margin-top: 16px; width: 100%; height: 62px; border: 1.5px solid #0e0e0e; border-radius: 999px; background: #fff; color: #0e0e0e; font-family: var(--font-caps); font-weight: 500; font-size: 1.35rem; letter-spacing: 0.24em; text-transform: uppercase; cursor: pointer; transition: transform .15s ease; }
.alerter:active { transform: scale(0.98); }
.alerter.on { background: #0e0e0e; color: #fff; }
.alerter:disabled { opacity: 0.55; cursor: default; }
.lancee { margin: 10px 0 0; text-align: center; font-family: var(--font-serif); font-style: italic; font-size: 1.45rem; color: var(--bordeaux); }
.vide-total { grid-column: 1 / -1; text-align: center; padding: 50px 20px; font-family: var(--font-serif); font-style: italic; font-size: 1.5rem; color: var(--bordeaux); background: var(--carte); border: 1.5px solid var(--bord); border-radius: 26px; }

/* Vue « liste » (bouton aux 3 traits) */
.grille.en-liste { grid-template-columns: 1fr; gap: 18px; }
.en-liste .carte { flex-direction: row; align-items: center; gap: 22px; }
.en-liste .affiche { flex: 0 0 360px; aspect-ratio: 16 / 9; }
.en-liste .alerter { flex: 0 0 240px; margin: 0; height: 54px; font-size: 1.05rem; }
.en-liste .lancee { flex: 1; text-align: left; margin: 0; }

/* --- Bouton rond « + » pour ajouter --- */
.ajouter { position: fixed; right: 30px; bottom: max(30px, env(safe-area-inset-bottom)); z-index: 7; width: 70px; height: 70px; border-radius: 50%; border: 0; background: var(--bordeaux); color: #fff; font-size: 2.4rem; line-height: 1; cursor: pointer; box-shadow: 0 14px 30px -12px rgba(20,20,20,0.7); display: grid; place-items: center; }

/* --- Menu, fenêtres --- */
.voile { position: fixed; inset: 0; z-index: 20; background: rgba(20,20,20,0.35); display: grid; place-items: center; padding: 16px; }
.fenetre { width: min(520px, 100%); background: var(--creme); border-radius: 26px; padding: 26px; box-shadow: 0 30px 70px -20px rgba(20,20,20,0.5); display: grid; gap: 14px; animation: monte .25s ease both; }
.fenetre h3 { margin: 0; font-family: var(--font-serif); font-style: italic; font-weight: 600; font-size: 2rem; color: var(--bordeaux); }
.fenetre p { margin: 0; color: var(--gris); }
.fenetre label { display: grid; gap: 6px; font-size: 0.82rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--bordeaux); }
.fenetre input, .fenetre select { width: 100%; height: 52px; border: 1.5px solid #ebe5de; background: #fff; border-radius: 999px; padding: 0 20px; font-family: var(--font-serif); font-style: italic; font-size: 1.25rem; color: var(--texte); }
.fenetre .actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 6px; }
.btn { height: 50px; padding: 0 26px; border: 1.5px solid #0e0e0e; border-radius: 999px; background: #0e0e0e; color: #fff; font-family: var(--font-caps); font-weight: 500; letter-spacing: 0.24em; text-transform: uppercase; font-size: 0.9rem; cursor: pointer; text-decoration: none; display: inline-grid; place-items: center; }
.btn.doux { background: #fff; color: #0e0e0e; }
.erreur { color: var(--rouge) !important; font-style: italic; }
.menu { position: fixed; left: calc(var(--barre) + 12px); top: 30px; z-index: 21; background: var(--creme); border-radius: 20px; padding: 10px; box-shadow: 0 24px 60px -18px rgba(20,20,20,0.5); display: grid; min-width: 250px; animation: monte .2s ease both; }
.menu button { border: 0; background: none; text-align: left; padding: 12px 16px; border-radius: 12px; font-family: var(--font-serif); font-style: italic; font-size: 1.35rem; color: var(--bordeaux); cursor: pointer; }
.menu button:hover { background: var(--rose-clair); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(24px, env(safe-area-inset-bottom)); z-index: 30; width: min(400px, calc(100vw - 24px)); background: var(--bordeaux); color: #fff; border-radius: 20px; padding: 14px 18px; display: grid; gap: 2px; box-shadow: 0 16px 40px -16px rgba(20,20,20,0.6); animation: monte .25s ease both; }
.toast b { font-family: var(--font-serif); font-style: italic; font-weight: 600; font-size: 1.3rem; }
.toast span { font-size: 0.92rem; opacity: 0.85; }
.verdict { position: fixed; left: 50%; top: 90px; transform: translateX(-50%); z-index: 25; width: min(460px, calc(100vw - 24px)); background: var(--creme); border-radius: 26px; padding: 18px; display: grid; grid-template-columns: 84px 1fr; gap: 16px; box-shadow: 0 30px 70px -20px rgba(20,20,20,0.5); animation: monte .3s ease both; }
.verdict img { width: 84px; height: 100px; object-fit: contain; border-radius: 16px; background: #fff; }
.verdict .t { font-family: var(--font-serif); font-style: italic; font-weight: 600; font-size: 1.35rem; color: var(--bordeaux); line-height: 1.2; }
.verdict .s { color: var(--gris); margin-top: 4px; }
.verdict .acts { grid-column: 1 / -1; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

/* ================= Écrans plus petits ================= */
@media (max-width: 1350px) {
  .titre h1 { font-size: 2.1rem; } .titre p { margin-left: 40px; font-size: 0.85rem; }
  .icones svg { width: 32px; height: 32px; } .icones button { padding: 6px 20px; }
  .recherche, .categories select, .vues button { height: 56px; } .vues button { width: 56px; }
  .recherche input, .categories select { font-size: 1.25rem; }
  .puce { min-width: 0; font-size: 1rem; height: 48px; } .compte { font-size: 1.3rem; }
}
@media (max-width: 760px) {
  :root { --barre: 0px; }
  /* Sur iPhone : la barre de gauche disparaît, et une bande bordeaux horizontale (avec le motif
     monogramme) se place entre le titre et la bannière */
  .barre { display: none; }
  .bande { display: block; position: relative; height: 78px; margin: 0 -12px 14px; background: var(--bordeaux); color: #fff; overflow: hidden; }
  .bande .burger { left: 16px; top: 19px; width: 40px; height: 40px; gap: 7px; }
  .bande .cs.grand { left: 74px; top: 17px; font-size: 2.3rem; }
  .bande .cs.reflet { font-size: 1.25rem; opacity: 0.28; }
  .page { padding: calc(6px + env(safe-area-inset-top)) 12px 100px; }
  header { padding: 8px 0 12px; gap: 8px; }
  .titre h1 { font-size: 1.02rem; -webkit-text-stroke: 0.5px var(--bordeaux); }
  .titre p { margin: 5px 0 0 12px; font-size: 0.56rem; letter-spacing: 0.26em; }
  .icones button { padding: 4px 9px; } .icones button + button { border-left-width: 1.5px; }
  .icones svg { width: 22px; height: 22px; }
  .badge { top: -4px; right: 0; min-width: 16px; height: 16px; font-size: 0.6rem; }
  .icones .chercher { display: none; }
  .banniere { height: auto; border-radius: 14px; }  /* bannière entière, sans recadrage */
  .outils { flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .recherche { flex: 1 1 100%; height: 50px; padding: 0 16px; }
  .recherche svg { width: 22px; height: 22px; }
  .recherche input, .categories select { font-size: 1.15rem; }
  .categories { flex: 1; } .categories select { height: 46px; padding-left: 20px; }
  .vues { gap: 8px; } .vues button { width: 46px; height: 46px; border-radius: 12px; } .vues button svg { width: 22px; height: 22px; }
  .puces { margin-top: 14px; gap: 6px; flex-wrap: wrap; } .puces .liste { gap: 8px; order: 2; flex: 1 1 100%; }
  .compte { order: 1; border-right: 0; }
  .puce { height: 40px; padding: 0 16px; font-size: 0.78rem; letter-spacing: 0.16em; }
  .compte { font-size: 1.1rem; padding-right: 8px; }
  .grille { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
  .affiche { border-radius: 14px; }
  .etat { left: 10px; top: 10px; font-size: 0.72rem; padding: 3px 9px 3px 8px; gap: 5px; }
  .etat::before { width: 7px; height: 7px; }
  .croix { right: 10px; top: 10px; width: 28px; height: 28px; font-size: 1.05rem; }
  .infos { padding: 0 12px 14px; gap: 2px; }
  .marque { font-size: 0.62rem; letter-spacing: 0.14em; }
  .nom { font-size: 0.98rem; }
  .taille { font-size: 0.8rem; margin-top: 2px; }
  .alerter { height: 42px; font-size: 0.8rem; letter-spacing: 0.14em; margin-top: 10px; white-space: nowrap; }

  .lancee { font-size: 0.95rem; }
  .en-liste .carte { gap: 10px; flex-wrap: wrap; }
  .en-liste .affiche { flex: 1 1 100%; aspect-ratio: 16 / 10; }
  .en-liste .alerter { flex: 1 1 100%; height: 40px; }
  .menu { position: absolute; left: 12px; }
  .ajouter { right: 16px; width: 60px; height: 60px; font-size: 2rem; }
}
</style>
</head>
<body>
<aside class="barre">
  <button class="burger" id="burger" type="button" aria-label="Menu"><i></i><i></i><i></i></button>
  <div class="cs grand" aria-hidden="true">CS<sup>✦</sup></div>
  <div class="cs reflet" style="left:16px;top:376px" aria-hidden="true">CS<sup>✦</sup></div>
  <div class="cs reflet" style="left:68px;top:540px" aria-hidden="true">CS<sup>✦</sup></div>
  <div class="cs reflet" style="left:22px;top:708px" aria-hidden="true">CS<sup>✦</sup></div>
  <div class="cs reflet" style="left:68px;top:886px" aria-hidden="true">CS<sup>✦</sup></div>
  <div class="cs reflet" style="left:26px;top:1072px" aria-hidden="true">CS<sup>✦</sup></div>
  <div class="cs reflet" style="left:68px;top:1230px" aria-hidden="true">CS<sup>✦</sup></div>
</aside>

<div class="page"><div class="contenu">
  <header>
    <div class="titre"><h1>CRUSH SHOPPER</h1><p>L'ASSISTANT DE TA WISHLIST.</p></div>
    <div class="icones">
      <button class="chercher" id="b-chercher" type="button" aria-label="Rechercher"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg></button>
      <button id="b-cloche" type="button" aria-label="Mes alertes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/><path d="M12 3v2"/></svg><span class="badge" id="badge" hidden>0</span></button>
      <button id="open-cle" type="button" aria-label="Mon accès"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="12" cy="8" r="4.2"/><path d="M4 21c1.2-4.2 4.3-6.3 8-6.3s6.8 2.1 8 6.3z"/></svg></button>
    </div>
  </header>

  <div class="bande" aria-label="Menu">
    <button class="burger" id="burger2" type="button" aria-label="Menu"><i></i><i></i><i></i></button>
    <div class="cs grand" aria-hidden="true">CS<sup>✦</sup></div>
    <div class="cs reflet" style="left:178px;top:8px" aria-hidden="true">CS<sup>✦</sup></div>
    <div class="cs reflet" style="left:214px;top:44px" aria-hidden="true">CS<sup>✦</sup></div>
    <div class="cs reflet" style="left:262px;top:10px" aria-hidden="true">CS<sup>✦</sup></div>
    <div class="cs reflet" style="left:300px;top:46px" aria-hidden="true">CS<sup>✦</sup></div>
    <div class="cs reflet" style="left:346px;top:8px" aria-hidden="true">CS<sup>✦</sup></div>
    <div class="cs reflet" style="left:386px;top:44px" aria-hidden="true">CS<sup>✦</sup></div>
  </div>

  <img class="banniere" src="banniere.jpg" alt="Ma Wishlist — la wishlist plus intelligente">

  <div class="outils">
    <label class="recherche"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
      <input id="q" type="search" placeholder="Rechercher un article, une marque..." aria-label="Rechercher un article, une marque"></label>
    <div class="categories"><select id="cat" aria-label="Catégorie"></select>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></div>
    <div class="vues">
      <button id="v-grille" class="on" type="button" aria-label="Vue en grille"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.8"/></svg></button>
      <button id="v-liste" type="button" aria-label="Vue en liste"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg></button>
    </div>
  </div>

  <div class="puces"><div class="liste" id="puces"></div><span class="compte" id="compte"></span></div>

  <div class="grille" id="grid"></div>
</div></div>

<button class="ajouter" id="b-ajouter" type="button" aria-label="Ajouter un article">+</button>

<div class="menu" id="menu" hidden>
  <button type="button" data-m="ajouter">Ajouter un article</button>
  <button type="button" data-m="alertes">Mes alertes</button>
  <button type="button" data-m="tous">Toute ma wishlist</button>
  <button type="button" data-m="acces">Mon accès</button>
</div>

<div class="voile" id="f-ajout" hidden>
  <form class="fenetre" id="add">
    <h3>Ajouter un crush</h3>
    <label>Lien de l'article<input id="f-url" type="url" placeholder="https://…" required></label>
    <label>Taille ou teinte<input id="f-opt" type="text" placeholder="ex. Taille L"></label>
    <label>Catégorie<select id="f-cat"></select></label>
    <p class="erreur" id="hint" hidden></p>
    <div class="actions"><button class="btn doux" type="button" data-fermer>Annuler</button><button class="btn" type="submit">Ajouter</button></div>
  </form>
</div>

<div class="voile" id="cle-panel" hidden>
  <form class="fenetre" id="cle-form">
    <h3>Mon accès</h3>
    <p>Colle ta clé d'accès pour retrouver ta wishlist sur cet appareil. Elle reste rangée ici.</p>
    <label>Clé d'accès<input id="cle" type="password" autocomplete="off" placeholder="github_pat_…"></label>
    <p id="cle-msg"></p>
    <div class="actions"><button class="btn doux" type="button" id="cle-off">Se déconnecter</button><button class="btn doux" type="button" data-fermer>Fermer</button><button class="btn" type="submit">Enregistrer</button></div>
  </form>
</div>

<div class="verdict" id="verdict" hidden role="dialog" aria-live="polite"><img id="v-img" alt=""><div><div class="t" id="v-titre"></div><div class="s" id="v-sous"></div></div><div class="acts" id="v-acts"></div></div>
<div class="toast" id="toast" hidden><b id="t-title"></b><span id="t-body"></span></div>

<script>
// ---------------------------------------------------------------- réglages
const DEPOT = "linaelh-cloud/crush-shopper";
// Pour les tests sur l'ordinateur seulement : ?api=http://127.0.0.1:… (refusé partout ailleurs,
// pour que la clé ne parte jamais vers un autre site que GitHub).
const local = ["127.0.0.1", "localhost"].includes(location.hostname);
const apiTest = new URLSearchParams(location.search).get("api");
const API = (local && apiTest && /^http:\/\/(127\.0\.0\.1|localhost):\d+$/.test(apiTest)) ? apiTest : "https://api.github.com";
const STATUTS = { dispo: "Disponible", rupture: "En rupture", attente: "Recherche…", bloque: "Indisponible", inconnu: "Indisponible" };
const CATEGORIES = ["Parfums", "Mode", "Beauté", "Accessoires", "Maison", "Luxe"];

// La clé est rangée dans CET appareil (stockage du navigateur), jamais sur le site.
function lireCle() { try { return localStorage.getItem("crush_cle") || ""; } catch (e) { return ""; } }
function rangerCle(v) { try { v ? localStorage.setItem("crush_cle", v) : localStorage.removeItem("crush_cle"); } catch (e) {} }
const cleValide = (t) => /^(github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{20,})$/.test(t || "");

let liste = { articles: [] }, sha = "", memoire = {}, ajoutes = new Set(), dejaMontres = new Set(), occupe = false;
const grid = document.getElementById("grid");

// ---------------------------------------------------------------- petits outils
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
let toastTimer;
function toast(title, body) {
  document.getElementById("t-title").textContent = title;
  document.getElementById("t-body").textContent = body;
  const t = document.getElementById("toast"); t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 5000);
}
// Le contenu des fichiers GitHub est « emballé » en base64 : on le déballe / remballe (accents compris).
const deballer = (b64) => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\n/g, "")), c => c.charCodeAt(0)));
const emballer = (texte) => { let s = ""; new TextEncoder().encode(texte).forEach(b => s += String.fromCharCode(b)); return btoa(s); };

// ---------------------------------------------------------------- le guichet de GitHub (API)
async function guichet(fichier, options = {}) {
  const r = await fetch(`${API}/repos/${DEPOT}/contents/${fichier}`, {
    ...options, cache: "no-store",
    headers: { "Authorization": `Bearer ${lireCle()}`, "Accept": "application/vnd.github+json", ...(options.body ? { "Content-Type": "application/json" } : {}) },
  });
  if (r.ok) return r.json();
  const raisons = { 401: "Ta clé d'accès n'est plus valide.", 403: "Ta clé d'accès ne permet pas de modifier ta wishlist.",
                    404: "Ta clé d'accès ne trouve pas ta wishlist.", 409: "conflit", 422: "conflit" };
  const err = new Error(raisons[r.status] || "Petit souci de connexion, réessaie dans un instant."); err.code = r.status; throw err;
}
async function lireFichier(fichier, defaut) {
  try { const f = await guichet(fichier); return { data: JSON.parse(deballer(f.content)), sha: f.sha }; }
  catch (e) { if (e.code === 404 && fichier === "etat.json") return { data: defaut, sha: "" }; throw e; }
}

// Modifier la liste : on relit toujours la version la plus récente, on applique le changement,
// puis on la redépose avec son « empreinte » (sha). Si quelqu'un (le robot) l'a changée entre-temps, on recommence.
async function modifierListe(changement, mot) {
  for (let essai = 0; essai < 3; essai++) {
    const frais = await lireFichier("wishlist.json");
    const nouvelle = frais.data; nouvelle.articles = nouvelle.articles || [];
    changement(nouvelle);
    try {
      const r = await guichet("wishlist.json", { method: "PUT", body: JSON.stringify({
        message: mot, content: emballer(JSON.stringify(nouvelle, null, 2) + "\n"), sha: frais.sha }) });
      liste = nouvelle; sha = r.content.sha; dessiner(); return;
    } catch (e) { if (e.code !== 409 && e.code !== 422) throw e; }
  }
  throw new Error("Petit souci de connexion, réessaie dans un instant.");
}

// ---------------------------------------------------------------- lecture et affichage
function siteDe(url) {
  try { const h = new URL(url).hostname.toLowerCase(); return h.includes("maccosmetics.") ? "MAC Cosmetics" : h.replace(/^www\./, ""); }
  catch (e) { return ""; }
}
function etatDe(a) {
  const m = memoire[a.url] || {};   // ce que le robot a noté dans sa mémoire pour ce lien
  return { ...m, statut: m.statut || "attente", attend: !m.statut };
}

async function charger() {
  if (!cleValide(lireCle())) { montrerCle("Entre ta clé pour voir ta wishlist."); dessiner(); return; }
  try {
    const [w, e] = await Promise.all([lireFichier("wishlist.json"), lireFichier("etat.json", {})]);
    liste = w.data; liste.articles = liste.articles || []; sha = w.sha; memoire = e.data || {};
    live(true, "GitHub veille");
    dessiner(); verdicts();
  } catch (err) {
    live(false, "Pas connectée");
    if (err.code === 401 || err.code === 403 || err.code === 404) montrerCle(err.message);
    else toast("Pas de connexion", "Je réessaie dans un instant.");
  }
}


// ---------------------------------------------------------------- les cartes
function categorieDe(a) { return a.categorie || (siteDe(a.url) === "MAC Cosmetics" ? "Beauté" : "Mode"); }
const COEUR_INUTILISE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-9-9.6C2 7.4 4.3 4.5 7.4 4.5c2 0 3.6 1.1 4.6 2.8 1-1.7 2.6-2.8 4.6-2.8 3.1 0 5.4 2.9 4.4 6.4-1.5 5-9 9.6-9 9.6z"/></svg>';

function card(a, index) {
  const m = etatDe(a);
  const c = el("article", "carte" + (dejaVues.has(a.url) ? " vue" : ""));
  c.style.animationDelay = Math.min(index, 8) * 50 + "ms";
  dejaVues.add(a.url);

  // L'affiche : la photo en grand, et le texte posé dessus
  const affiche = el("a", "affiche" + (m.photo ? "" : " sans-photo")); affiche.href = a.url; affiche.target = "_blank"; affiche.rel = "noopener";
  if (m.photo) { const img = el("img"); img.src = m.photo; img.alt = a.nom || m.nom || "Article"; img.referrerPolicy = "no-referrer"; img.loading = "lazy"; affiche.append(img); }
  else affiche.append(el("span", "vide", m.attend ? "On regarde le stock…" : ""));
  affiche.append(el("span", "etat " + m.statut, STATUTS[m.statut] || m.statut));
  const x = el("button", "croix", "×"); x.type = "button"; x.setAttribute("aria-label", "Retirer de ma wishlist"); x.title = "Retirer de ma wishlist";
  x.onclick = (e) => { e.preventDefault(); e.stopPropagation(); retirer(a.url); };
  affiche.append(x);
  const infos = el("div", "infos");
  infos.append(el("p", "marque", m.marque || siteDe(a.url)));
  infos.append(el("p", "nom", a.nom || m.nom || "Nouvel article"));
  const detail = [a.option, m.prix].filter(Boolean).join(" · ");
  if (detail) infos.append(el("p", "taille", detail));
  affiche.append(infos);
  c.append(affiche);

  const b = el("button", "alerter" + (a.crush_alert ? " on" : ""), "Crush Alerte");
  const lisible = m.statut === "dispo" || m.statut === "rupture";
  b.disabled = occupe || (!lisible && !a.crush_alert);
  b.title = a.crush_alert ? "Arrêter l'alerte" : (lisible ? "Être prévenue quand il revient" : (m.attend ? "Un instant, on regarde le stock" : "L'alerte n'est pas possible pour cet article"));
  b.onclick = () => basculer(a.url);
  c.append(b);
  if (a.crush_alert) c.append(el("p", "lancee", "Ton alerte est lancée, garde un œil sur ton téléphone."));
  else if (m.eteinte_le) c.append(el("p", "lancee", "💌 Tu as été prévenue : il était de retour."));
  return c;
}

// ---------------------------------------------------------------- filtres et affichage
const dejaVues = new Set();
let filtreCat = "Tous", seulementAlertes = false, recherche = "";
const selCat = document.getElementById("cat"), selAjout = document.getElementById("f-cat");
selCat.append(...[["Tous", "Toutes les catégories"], ...CATEGORIES.map(c => [c, c])].map(([v, t]) => { const o = el("option", null, t); o.value = v; return o; }));
selAjout.append(...CATEGORIES.map(c => { const o = el("option", null, c); o.value = c; return o; }));
selAjout.value = "Mode";
selCat.onchange = () => { filtreCat = selCat.value; seulementAlertes = false; dessiner(); };
document.getElementById("q").addEventListener("input", (e) => { recherche = e.target.value.trim().toLowerCase(); dessiner(); });

function garde(a) {
  const m = memoire[a.url] || {};
  if (seulementAlertes && !a.crush_alert) return false;
  if (filtreCat !== "Tous" && categorieDe(a) !== filtreCat) return false;
  if (recherche) {
    const t = [a.nom, m.nom, m.marque, a.option, siteDe(a.url)].join(" ").toLowerCase();
    if (!t.includes(recherche)) return false;
  }
  return true;
}
function dessiner() {
  const tous = [...(liste.articles || [])].reverse(); // le plus récent d'abord
  document.getElementById("puces").replaceChildren(...["Tous", ...CATEGORIES].map(cat => {
    const p = el("button", "puce" + (filtreCat === cat && !seulementAlertes ? " on" : ""), cat); p.type = "button";
    p.onclick = () => { filtreCat = cat; seulementAlertes = false; selCat.value = cat; dessiner(); };
    return p;
  }));
  const articles = tous.filter(garde);
  grid.replaceChildren(...(articles.length ? articles.map(card)
    : [el("div", "vide-total", !lireCle() ? "Connecte-toi (en haut à droite) pour voir ta wishlist." : tous.length ? "Aucun article ici pour l'instant." : "Touche le + pour ajouter ton premier crush ✨")]));
  document.getElementById("compte").textContent = `${articles.length} article${articles.length > 1 ? "s" : ""}`;
  const n = tous.filter(a => a.crush_alert).length, badge = document.getElementById("badge");
  badge.textContent = n; badge.hidden = !n;
}

function live() {}  // (plus d'indicateur technique à l'écran)

// Vue grille / liste (retenue sur cet appareil)
const vG = document.getElementById("v-grille"), vL = document.getElementById("v-liste");
function vue(liste_) {
  grid.classList.toggle("en-liste", liste_); vG.classList.toggle("on", !liste_); vL.classList.toggle("on", liste_);
  try { localStorage.setItem("crush_vue", liste_ ? "liste" : "grille"); } catch (e) {}
}
vG.onclick = () => vue(false); vL.onclick = () => vue(true);
try { vue(localStorage.getItem("crush_vue") === "liste"); } catch (e) {}

// ---------------------------------------------------------------- actions
async function action(fn, okTitre, okTexte) {
  if (occupe) return; occupe = true; dessiner();
  try { await fn(); guetterLeRobot(); if (okTitre) toast(okTitre, okTexte); }
  catch (e) { toast("Oups", e.message); }
  finally { occupe = false; dessiner(); }
}
function teinteDuLien(url) { const m = url.match(/[?&]shade=([^&#]+)/); return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : ""; }

// Fenêtres
const fAjout = document.getElementById("f-ajout"), panneau = document.getElementById("cle-panel"), menu = document.getElementById("menu");
document.querySelectorAll("[data-fermer]").forEach(b => b.onclick = () => { fAjout.hidden = true; panneau.hidden = true; });
[fAjout, panneau].forEach(v => v.addEventListener("click", (e) => { if (e.target === v) v.hidden = true; }));
function ouvrirAjout() {
  menu.hidden = true;
  if (!cleValide(lireCle())) { montrerCle("Entre d'abord ta clé."); return; }
  fAjout.hidden = false; document.getElementById("hint").hidden = true;
  setTimeout(() => document.getElementById("f-url").focus(), 50);
}
document.getElementById("b-ajouter").onclick = ouvrirAjout;
function ouvrirMenu(e) {
  e.stopPropagation(); menu.hidden = !menu.hidden;
  const bande = document.querySelector(".bande");
  menu.style.top = getComputedStyle(bande).display !== "none" ? (bande.getBoundingClientRect().bottom + window.scrollY + 6) + "px" : "";
}
document.getElementById("burger").onclick = ouvrirMenu;
document.getElementById("burger2").onclick = ouvrirMenu;
document.addEventListener("click", (e) => { if (!menu.hidden && !menu.contains(e.target)) menu.hidden = true; });
menu.onclick = (e) => {
  const m = e.target.dataset.m; if (!m) return; menu.hidden = true;
  if (m === "ajouter") ouvrirAjout();
  if (m === "alertes") { seulementAlertes = true; dessiner(); }
  if (m === "tous") { seulementAlertes = false; filtreCat = "Tous"; selCat.value = "Tous"; dessiner(); }
  if (m === "acces") ouvrirCle();
};
document.getElementById("b-cloche").onclick = () => {
  seulementAlertes = !seulementAlertes; dessiner();
  toast(seulementAlertes ? "Mes alertes 💌" : "Toute ma wishlist", seulementAlertes ? "Voici les articles que je surveille pour toi." : "");
};
document.getElementById("b-chercher").onclick = () => document.getElementById("q").focus();

document.getElementById("add").addEventListener("submit", (e) => {
  e.preventDefault();
  const url = document.getElementById("f-url").value.trim();
  let option = document.getElementById("f-opt").value.trim();
  const categorie = selAjout.value;
  const hint = document.getElementById("hint");
  if (!/^https?:\/\//.test(url)) { hint.textContent = "Colle le lien complet de l'article (il commence par https://)."; hint.hidden = false; return; }
  const teinte = siteDe(url) === "MAC Cosmetics" ? teinteDuLien(url) : "";
  if (!option && teinte) option = "Teinte " + teinte;
  action(async () => {
    await modifierListe((w) => {
      if (w.articles.some(a => a.url === url && (a.option || "") === option)) throw new Error("Cet article est déjà dans ta wishlist.");
      w.articles.push({ nom: "", option, teinte, url, categorie, crush_alert: false, ajoute_le: new Date().toISOString() });
    }, "Article ajouté depuis la page wishlist");
    ajoutes.add(url);
    e.target.reset(); selAjout.value = "Mode"; fAjout.hidden = true;
    toast("Ajouté ✨", "Je regarde le stock pour toi.");
  });
});

function basculer(url) {
  let allume = false;
  action(async () => {
    await modifierListe((w) => { const a = w.articles.find(x => x.url === url); if (a) { a.crush_alert = !a.crush_alert; allume = a.crush_alert; } }, "Crush Alert changée depuis la page wishlist");
  }).then(() => toast(allume ? "Alerte activée 💌" : "Alerte arrêtée", allume ? "Je te préviens dès qu'il revient." : "Tu ne seras plus prévenue pour cet article."));
}
function retirer(url) {
  if (!confirm("Retirer cet article de ta wishlist ?")) return;
  action(() => modifierListe((w) => { w.articles = w.articles.filter(a => a.url !== url); }, "Article retiré depuis la page wishlist"), "Retiré", "L'article n'est plus dans ta wishlist.");
}

// Juste après un ajout : dès que le robot a lu la page, on affiche le verdict
function verdicts() {
  for (const url of ajoutes) {
    const m = memoire[url]; const a = (liste.articles || []).find(x => x.url === url);
    if (!a || !m || !m.statut || dejaMontres.has(url)) continue;
    dejaMontres.add(url); ajoutes.delete(url); afficherVerdict(a, m); break;
  }
}
function afficherVerdict(a, m) {
  const v = document.getElementById("verdict"), acts = document.getElementById("v-acts"), sous = document.getElementById("v-sous");
  const nom = a.nom || m.nom || "Cet article", opt = a.option ? ` (${a.option})` : "";
  document.getElementById("v-img").src = m.photo || "icon-192.png";
  acts.replaceChildren();
  const fermer = el("button", "btn doux", "Fermer"); fermer.type = "button"; fermer.onclick = () => v.hidden = true;
  if (m.statut === "rupture") {
    document.getElementById("v-titre").textContent = `${nom}${opt} est en rupture.`;
    sous.textContent = "Active l'alerte : je te préviens dès qu'il revient.";
    const go = el("button", "btn", "Alerter 💌"); go.type = "button";
    go.onclick = () => { v.hidden = true; if (!a.crush_alert) basculer(a.url); };
    acts.append(fermer, go);
  } else if (m.statut === "dispo") {
    document.getElementById("v-titre").textContent = `${nom}${opt} est disponible !`;
    sous.textContent = "Fonce, il t'attend.";
    const lien = el("a", "btn", "Voir l'article"); lien.href = a.url; lien.target = "_blank"; lien.rel = "noopener";
    acts.append(fermer, lien);
  } else {
    document.getElementById("v-titre").textContent = "Je n'arrive pas à voir le stock de cet article.";
    sous.textContent = "Il reste dans ta wishlist, mais l'alerte n'est pas possible sur ce site.";
    acts.append(fermer);
  }
  v.hidden = false;
}

// ---------------------------------------------------------------- Mon accès
function montrerCle(msg) { panneau.hidden = false; document.getElementById("cle-msg").textContent = msg || ""; }
function ouvrirCle() { panneau.hidden = false; document.getElementById("cle-msg").textContent = lireCle() ? "✅ Tu es connectée sur cet appareil." : ""; }
document.getElementById("open-cle").onclick = ouvrirCle;
document.getElementById("cle-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const v = document.getElementById("cle").value.trim();
  if (!cleValide(v)) { document.getElementById("cle-msg").textContent = "Cette clé ne semble pas bonne : elle commence par github_pat_"; return; }
  rangerCle(v); document.getElementById("cle").value = "";
  document.getElementById("cle-msg").textContent = "Connexion…";
  await charger(); planifier(60000);
  if (sha) { panneau.hidden = true; toast("Bienvenue ✨", "Voici ta wishlist."); }
});
document.getElementById("cle-off").onclick = () => { rangerCle(""); liste = { articles: [] }; memoire = {}; dessiner(); montrerCle("Tu es déconnectée sur cet appareil."); };

// ---------------------------------------------------------------- relecture régulière
// Toutes les 15 s quand le robot doit lire un article, sinon toutes les minutes.
let minuteur;
function planifier(delai) { clearTimeout(minuteur); minuteur = setTimeout(boucle, delai); }
async function boucle() {
  if (!occupe && !document.hidden) await charger();
  const attente = (liste.articles || []).some(a => !(memoire[a.url] || {}).statut) || ajoutes.size || Date.now() < reveilJusqua;
  planifier(attente ? 15000 : 60000);
}
// Après un changement, le robot va passer : on relit souvent pendant 4 minutes.
let reveilJusqua = 0;
function guetterLeRobot() { reveilJusqua = Date.now() + 4 * 60000; planifier(15000); }
document.addEventListener("visibilitychange", () => { if (!document.hidden && !occupe) charger(); });
dessiner();
boucle();
</script>
</body>
</html>
