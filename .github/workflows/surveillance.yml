# La « recette » que GitHub suit pour faire tourner le robot Crush Shopper.
name: Surveillance Crush Shopper

on:
  # Le bouton « Run workflow » dans l'onglet Actions, pour lancer un test à la main.
  workflow_dispatch:
  # Le réveil automatique : activé le 17/11 après le test réussi (lancement #3).
  # Toutes les 5 minutes, le minimum autorisé par GitHub (il peut avoir quelques minutes de retard).
  schedule:
    - cron: "*/5 * * * *"
  # Le réveil « sonnette » : dès que ma page wishlist change la liste (ajout, Crush Alert,
  # bouton « Vérifier »), le robot part tout de suite. Ses propres enregistrements ne le
  # réveillent pas (GitHub l'interdit, pour éviter une boucle sans fin).
  push:
    branches: [main]
    paths: [wishlist.json]

permissions:
  contents: write   # pour enregistrer la mémoire du robot (etat.json)

# Un seul robot à la fois : si un lancement est en cours, le suivant attend son tour
# (sinon deux robots écrivent la mémoire en même temps et GitHub refuse le second).
concurrency:
  group: surveillance
  cancel-in-progress: false

jobs:
  surveiller:
    # Ubuntu 24.04 et pas « ubuntu-latest » : depuis octobre 2026, « latest » = Ubuntu 26,
    # trop récent pour l'installateur de Chrome de Playwright (1er test raté à cause de ça).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Récupérer le code du robot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"   # garder les outils Python de côté d'une fois sur l'autre

      # Le « cache » : GitHub garde Chrome dans un placard entre deux lancements,
      # au lieu de le retélécharger à chaque fois (le plus long de la recette).
      - name: Ressortir Chrome du placard (cache)
        id: placard
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chrome-playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Installer Playwright et Chrome
        run: |
          pip install -r requirements.txt
          if [ "${{ steps.placard.outputs.cache-hit }}" = "true" ]; then
            echo "Chrome trouvé dans le placard : on installe seulement ce qui l'entoure."
            python -m playwright install-deps chromium
          else
            echo "Placard vide : on télécharge Chrome (une seule fois)."
            python -m playwright install --with-deps chromium
          fi

      - name: Lancer le robot (dans un écran imaginaire)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_ADRESSE: ${{ secrets.EMAIL_ADRESSE }}
          EMAIL_MOT_DE_PASSE: ${{ secrets.EMAIL_MOT_DE_PASSE }}
          EMAIL_DESTINATAIRE: ${{ secrets.EMAIL_DESTINATAIRE }}
        run: xvfb-run --auto-servernum python surveille.py

      - name: Garder les captures d'écran du robot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-du-robot
          path: captures/

      - name: Enregistrer la mémoire du robot
        if: always()
        run: |
          git config user.name "Crush Shopper"
          git config user.email "actions@users.noreply.github.com"
          # etat.json = sa mémoire ; wishlist.json = Crush Alert éteinte après un message envoyé
          git add etat.json wishlist.json
          git diff --cached --quiet && exit 0
          git commit -m "Mémoire du robot mise à jour"
          for essai in 1 2 3; do
            # Relire le carnet juste avant d'écrire (au cas où il a changé entre-temps), puis envoyer
            if git pull --rebase && git push; then exit 0; fi
            # J'ai changé ma liste depuis la page pendant que le robot travaillait :
            # on garde SA mémoire, on reprend MA liste la plus récente, et on y remet ses extinctions.
            git rebase --abort || true
            cp etat.json /tmp/etat.json
            git fetch origin main && git reset --hard origin/main
            cp /tmp/etat.json etat.json
            python surveille.py --reappliquer
            git add etat.json wishlist.json
            git diff --cached --quiet && exit 0
            git commit -m "Mémoire du robot mise à jour"
          done
          exit 1
