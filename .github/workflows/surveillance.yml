# La « recette » que GitHub suit pour faire tourner le robot Crush Shopper.
name: Surveillance Crush Shopper

on:
  # Le bouton « Run workflow » dans l'onglet Actions, pour lancer un test à la main.
  workflow_dispatch:
  # Le réveil automatique : activé le 17/11 après le test réussi (lancement #3).
  # Toutes les 5 minutes, le minimum autorisé par GitHub (il peut avoir quelques minutes de retard).
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write   # pour enregistrer la mémoire du robot (etat.json)

# Un seul robot à la fois : si un lancement est en cours, le suivant attend son tour
# (sinon deux robots écrivent la mémoire en même temps et GitHub refuse le second).
concurrency:
  group: surveillance
  cancel-in-progress: false

jobs:
  surveiller:
    # Ubuntu 24.04 et pas « ubuntu-latest » : depuis octobre 2026, « latest » = Ubuntu 26,
    # trop récent pour l'installateur de Chrome de Playwright (1er test raté à cause de ça).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Récupérer le code du robot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer Playwright et Chrome
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Lancer le robot (dans un écran imaginaire)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_ADRESSE: ${{ secrets.EMAIL_ADRESSE }}
          EMAIL_MOT_DE_PASSE: ${{ secrets.EMAIL_MOT_DE_PASSE }}
          EMAIL_DESTINATAIRE: ${{ secrets.EMAIL_DESTINATAIRE }}
        run: xvfb-run --auto-servernum python surveille.py

      - name: Garder les captures d'écran du robot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-du-robot
          path: captures/

      - name: Enregistrer la mémoire du robot
        if: always()
        run: |
          git config user.name "Crush Shopper"
          git config user.email "actions@users.noreply.github.com"
          git add etat.json
          # Relire le carnet juste avant d'écrire (au cas où il a changé entre-temps), puis envoyer
          git diff --cached --quiet || (git commit -m "Mémoire du robot mise à jour" && git pull --rebase && git push)
